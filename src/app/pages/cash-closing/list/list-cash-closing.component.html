<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">{{title}}</h4>
      <p class="page-subtitle">Consulta y gestiona los cierres de caja</p>
    </div>
    <button *ngIf="storeSelected && cashClosings" type="button" (click)="createCashClosing()" class="btn-add">
      <i class="material-icons">add</i>
      Crear Cierre de Caja
    </button>
  </div>

  <store-required *ngIf="!storeSelected" message="Selecciona una tienda para ver sus cierres de caja"></store-required>

  <div class="content-card" *ngIf="storeSelected">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search($event)" />
      </div>
      <div class="toolbar-right">
        <div class="dropdown" *ngIf="availableStatuses.length">
          <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            {{ statusFilter || 'Estado' }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="filterByStatus(null)">Todos</a></li>
            <li *ngFor="let s of availableStatuses">
              <a class="dropdown-item" (click)="filterByStatus(s)">{{ s }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <data-table *ngIf="cashClosings" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="!cashClosings" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
