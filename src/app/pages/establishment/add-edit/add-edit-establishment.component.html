<div class="genericCard pt-3">
    <mat-card class="mat-elevation-z8">
        <mat-card-header style="justify-content: center;">
            <mat-card-title>{{title}}</mat-card-title>
            <!-- <mat-card-subtitle>Tienda</mat-card-subtitle> -->
        </mat-card-header>
        <mat-card-content>
            <br>
            <div *ngIf="loading" class="text-center m-5">
                <span class="spinner-border spinner-border-lg align-center"></span>
            </div>
            <form *ngIf="!loading" [formGroup]="establishmentForm" (ngSubmit)="onSaveForm()">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="d-flex flex-wrap justify-content-center justify-content-md-start col-md-8 align-self-start">
                            <mat-form-field class="col-sm-6 col-md-6 custom-input align-self-start" appearance="outline">
                                <mat-label>Nombre</mat-label>
                                <input id="nombre-form-crear-comunidad" type="text" formControlName="name" matInput
                                    [ngClass]="{ 'is-invalid': f['name'].errors }" />
                                <div class="invalid-feedback" *ngIf="f['name'].errors">
                                    <div *ngIf="f['name'].hasError('required')">
                                        Nombre requerido
                                    </div>
                                    <div *ngIf="f['name'].errors['maxlength']">
                                        La descripcion debe tener maximo 50 caracteres
                                    </div>
                                </div>
                            </mat-form-field>
                            <mat-form-field class="col-sm-6 col-md-6 custom-input align-self-start" appearance="outline">
                                <mat-label>Direccion</mat-label>
                                <input id="address-form-crear-comunidad" type="text" formControlName="address" matInput
                                    [ngClass]="{ 'is-invalid': f['address'].errors }" />
                                <div class="invalid-feedback" *ngIf="f['address'].errors">
                                    <div *ngIf="f['address'].hasError('required')">
                                        Direccion requerida
                                    </div>
                                    <div *ngIf="f['address'].errors['maxlength']">
                                        La descripcion debe tener maximo 50 caracteres
                                    </div>
                                </div>
                            </mat-form-field>
                            <mat-form-field class="col-sm-12 col-md-12 custom-input align-self-start" appearance="outline">
                                <mat-label>Descripcion</mat-label>
                                <textarea id="description-form-crear-comunidad" type="text" formControlName="description" matInput
                                    [ngClass]="{ 'is-invalid': f['description'].errors }"></textarea>
                            </mat-form-field>
                            <mat-form-field class="col-sm-6 col-md-6 custom-input align-self-start" appearance="outline">
                                <mat-label>Tipo de tienda</mat-label>
                                <mat-select matInput disableOptionCentering formControlName="establishmentTypeId"
                                    [ngClass]="{ 'is-invalid': f['establishmentTypeId'].errors }">
                                    <mat-option *ngFor="let type of establishmentTypeOptions" [value]="type.id">{{type.name}}</mat-option>
                                </mat-select>
                                <div class="invalid-feedback" *ngIf="f['establishmentTypeId'].errors">
                                    <div *ngIf="f['establishmentTypeId'].errors['required']">
                                        Tipo de tienda requerido
                                    </div>
                                </div>
                            </mat-form-field>
                            <div class="col-sm-12 col-md-12 my-2 px-2">
                                <mat-card class="mat-elevation-z2 p-3" style="border-left: 4px solid orange;">
                                    <div class="d-flex align-items-center gap-3">
                                        <mat-checkbox formControlName="receivePendingOrdersEnabled" class="orange-checkbox">
                                        </mat-checkbox>
                                        <span style="font-size: 0.95rem;">Recibir pedidos pendientes desde tienda</span>
                                    </div>
                                </mat-card>
                            </div>
                        </div>
                        <div class="col-sm-12 text-center p-2">
                            <button id="boton-form-crear-comunidad" type="submit" [disabled]="submitting || establishmentForm.invalid"
                                class="btn btn-outline-success btn-lg">
                                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                                Guardar Tienda
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
