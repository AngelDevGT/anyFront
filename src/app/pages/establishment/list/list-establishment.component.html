<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">{{title}}</h4>
      <p class="page-subtitle" *ngIf="isInventory">Gestiona el inventario y operaciones de las tiendas</p>
      <p class="page-subtitle" *ngIf="!isInventory">Administra las tiendas registradas</p>
    </div>
    <button *ngIf="establishments && !isInventory" type="button" routerLink="create" class="btn-add">
      <i class="material-icons">add</i>
      Crear Tienda
    </button>
  </div>

  <div class="content-card">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search($event)" />
      </div>
    </div>

    <data-table *ngIf="establishments" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="!establishments" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
