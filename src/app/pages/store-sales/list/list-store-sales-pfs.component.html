<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">Ventas de Tienda<span *ngIf="storeName"> — {{storeName}}</span></h4>
      <p class="page-subtitle">Historial de ventas registradas</p>
    </div>
    <button *ngIf="shopResumes" type="button" (click)="saveSale()" class="btn-add">
      <i class="material-icons">add</i>
      Registrar venta
    </button>
  </div>

  <div class="content-card">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search($event)" />
      </div>
      <div class="toolbar-right">
        <div class="dropdown" *ngIf="availableSaleStatuses.length">
          <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            {{ saleStatusFilter || 'Estado pedido' }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="filterBySaleStatus(null)">Todos</a></li>
            <li *ngFor="let s of availableSaleStatuses">
              <a class="dropdown-item" (click)="filterBySaleStatus(s)">{{ s }}</a>
            </li>
          </ul>
        </div>
        <div class="dropdown" *ngIf="availableOrderPaymentStatuses.length">
          <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            {{ orderPaymentStatusFilter || 'Estado pago pedido' }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="filterByOrderPaymentStatus(null)">Todos</a></li>
            <li *ngFor="let s of availableOrderPaymentStatuses">
              <a class="dropdown-item" (click)="filterByOrderPaymentStatus(s)">{{ s }}</a>
            </li>
          </ul>
        </div>
        <div class="dropdown" *ngIf="availableDeliveryPaymentStatuses.length">
          <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            {{ deliveryPaymentStatusFilter || 'Estado pago envío' }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="filterByDeliveryPaymentStatus(null)">Todos</a></li>
            <li *ngFor="let s of availableDeliveryPaymentStatuses">
              <a class="dropdown-item" (click)="filterByDeliveryPaymentStatus(s)">{{ s }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <data-table *ngIf="shopResumes" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="!shopResumes" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
