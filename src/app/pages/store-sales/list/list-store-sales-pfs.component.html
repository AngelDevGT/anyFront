<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">{{ readOnly ? 'Ventas' : 'Ventas de Tienda' }}</h4>
      <p *ngIf="storeName" class="store-name-label">{{ storeName }}</p>
      <p class="page-subtitle">Historial de ventas registradas</p>
    </div>
    <store-picker *ngIf="storePicker"
                  storageKey="/consultas/ventas"
                  (storeChange)="onStoreChange($event)"></store-picker>
    <button *ngIf="!readOnly && shopResumes" type="button" (click)="saveSale()" class="btn-add">
      <i class="material-icons">add</i>
      Registrar venta
    </button>
  </div>

  <store-required *ngIf="!storePicker && !storeSelected" message="Selecciona una tienda para ver sus ventas"></store-required>

  <div class="content-card" *ngIf="storePicker || storeSelected">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search($event)" />
      </div>
      <div class="toolbar-right">
        <div class="date-wrapper" (click)="$event.stopPropagation()">
          <button class="filter-main-btn" [class.open]="datePanelOpen" type="button" (click)="toggleDatePanel($event)">
            <i class="material-icons" style="font-size:17px">event</i>
            Fecha
            <span *ngIf="dateRangeLabel" class="date-range-label">{{ dateRangeLabel }}</span>
            <i class="material-icons chevron-icon">keyboard_arrow_down</i>
          </button>

          <div class="date-panel" *ngIf="datePanelOpen">
            <div class="filter-panel-header">
              <span class="filter-panel-title">
                <i class="material-icons" style="font-size:16px">event</i>
                Rango de fechas
              </span>
              <button class="filter-close-btn" type="button" (click)="closeDatePanel()">
                <i class="material-icons" style="font-size:18px">close</i>
              </button>
            </div>

            <div class="date-panel-body">
              <mat-calendar
                [selected]="selectedDateRange"
                [maxDate]="maxDate"
                (selectedChange)="onDateRangeChange($event)">
              </mat-calendar>
            </div>

            <div class="filter-panel-footer">
              <button class="btn-reset" type="button" (click)="resetDateRange()">Últimos 15 días</button>
              <button class="btn-filter-apply" type="button" (click)="applyDateRange()">Buscar</button>
            </div>
          </div>
        </div>

        <div class="filter-wrapper" (click)="$event.stopPropagation()">
          <button class="filter-main-btn" [class.open]="filterPanelOpen" type="button" (click)="toggleFilterPanel($event)">
            <i class="material-icons" style="font-size:17px">filter_list</i>
            Filtro
            <span *ngIf="activeFilterCount" class="filter-badge">{{ activeFilterCount }}</span>
            <i class="material-icons chevron-icon">keyboard_arrow_down</i>
          </button>

          <div class="filter-panel" *ngIf="filterPanelOpen">
            <div class="filter-panel-header">
              <span class="filter-panel-title">
                <i class="material-icons" style="font-size:16px">filter_list</i>
                Filtro
              </span>
              <button class="filter-close-btn" type="button" (click)="closeFilterPanel()">
                <i class="material-icons" style="font-size:18px">close</i>
              </button>
            </div>

            <div class="filter-section" *ngIf="availableSaleStatuses.length">
              <button class="filter-section-header" type="button" (click)="saleStatusExpanded = !saleStatusExpanded">
                <i class="material-icons chevron">{{ saleStatusExpanded ? 'expand_more' : 'chevron_right' }}</i>
                Estado venta
              </button>
              <div class="filter-section-body" *ngIf="saleStatusExpanded">
                <label class="filter-option" *ngFor="let s of availableSaleStatuses">
                  <input type="checkbox" [checked]="pendingSaleStatuses.includes(s)" (change)="toggleSaleStatus(s)" />
                  {{ s }}
                </label>
              </div>
            </div>

            <div class="filter-section" *ngIf="availableOrderPaymentStatuses.length">
              <button class="filter-section-header" type="button" (click)="orderPaymentExpanded = !orderPaymentExpanded">
                <i class="material-icons chevron">{{ orderPaymentExpanded ? 'expand_more' : 'chevron_right' }}</i>
                Estado pago pedido
              </button>
              <div class="filter-section-body" *ngIf="orderPaymentExpanded">
                <label class="filter-option" *ngFor="let s of availableOrderPaymentStatuses">
                  <input type="checkbox" [checked]="pendingOrderPaymentStatuses.includes(s)" (change)="toggleOrderPaymentStatus(s)" />
                  {{ s }}
                </label>
              </div>
            </div>

            <div class="filter-section" *ngIf="availableDeliveryPaymentStatuses.length">
              <button class="filter-section-header" type="button" (click)="deliveryPaymentExpanded = !deliveryPaymentExpanded">
                <i class="material-icons chevron">{{ deliveryPaymentExpanded ? 'expand_more' : 'chevron_right' }}</i>
                Estado pago envío
              </button>
              <div class="filter-section-body" *ngIf="deliveryPaymentExpanded">
                <label class="filter-option" *ngFor="let s of availableDeliveryPaymentStatuses">
                  <input type="checkbox" [checked]="pendingDeliveryPaymentStatuses.includes(s)" (change)="toggleDeliveryPaymentStatus(s)" />
                  {{ s }}
                </label>
              </div>
            </div>

            <div class="filter-panel-footer">
              <button class="btn-reset" type="button" (click)="resetFilters()">Restablecer</button>
              <button class="btn-filter-apply" type="button" (click)="applyFilters()">Filtrar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="storePicker && !storeSelected" class="empty-state">
      <i class="material-icons">storefront</i>
      <p>Selecciona una tienda para ver sus ventas</p>
    </div>

    <data-table *ngIf="storeSelected && shopResumes" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="storeSelected && !shopResumes" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
