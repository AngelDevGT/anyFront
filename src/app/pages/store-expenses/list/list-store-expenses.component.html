<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">Gastos de Tienda</h4>
      <p class="page-subtitle">Administra los gastos registrados de la tienda</p>
    </div>
    <button *ngIf="storeSelected && expenses" type="button" (click)="createExpense()" class="btn-add">
      <i class="material-icons">add</i>
      Registrar Gasto
    </button>
  </div>

  <store-required *ngIf="!storeSelected" message="Selecciona una tienda para ver sus gastos"></store-required>

  <div class="content-card" *ngIf="storeSelected">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search()" />
      </div>
    </div>

    <data-table *ngIf="expenses" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="!expenses" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
