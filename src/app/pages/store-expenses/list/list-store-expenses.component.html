<div class="genericCard pt-3">
    <mat-card class="mat-elevation-z8">
        <mat-card-header style="justify-content: center;">
            <mat-card-title>
                <strong *ngIf="establishment">{{establishment.name}}</strong>: Gastos de Tienda
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <div class="container">
                <div class="row justify-content-center">
                    <div *ngIf="expenses" class="d-flex flex-wrap justify-content-md-between justify-content-center pb-0">
                        <div>
                            <button type="button" (click)="createExpense()" class="btn btn-outline-success m-2">
                                <div class="d-flex flex-row p-1">
                                    <i class="material-icons icon">add</i>
                                    <span>Registrar Gasto</span>
                                </div>
                            </button>
                        </div>
                        <div class="d-flex flex-wrap justify-content-md-end justify-content-center pb-0">
                            <div class="select-filter mx-2">
                                <mat-form-field appearance="outline">
                                    <mat-label>Buscar</mat-label>
                                    <input type="text" matInput [(ngModel)]="searchTerm" (input)="search()" />
                                </mat-form-field>
                            </div>
                            <mat-form-field class="col-lg-2 col-2" appearance="outline">
                                <mat-select matInput disableOptionCentering [(value)]="pageSize">
                                    <mat-option *ngFor="let entry of entries" [value]="entry">
                                        {{ entry }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>
                    <responsive-table
                        *ngIf="expenses"
                        [tableElements]="tableElementsValues"
                        [pageSize]="pageSize"
                        [pageKey]="'store-expenses-list'">
                    </responsive-table>
                    <span *ngIf="!expenses" class="spinner-border spinner-border-lg align-center"></span>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
