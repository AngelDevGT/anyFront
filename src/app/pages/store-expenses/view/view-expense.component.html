<div class="genericCard pt-3">
    <mat-card class="mat-elevation-z8">
        <div *ngIf="loading" class="text-center m-5">
            <span class="spinner-border spinner-border-lg align-center"></span>
        </div>
        <mat-card-header *ngIf="!loading" style="justify-content: center;">
            <mat-card-title>{{expense?.establishment?.name}}</mat-card-title>
        </mat-card-header>
        <br>
        <mat-card-content *ngIf="!loading">
            <div class="d-flex flex-wrap justify-content-center col-md-12">
                <div class="col-12">
                    <view-object [objectElements]="elements"></view-object>
                </div>
            </div>
            <div class="d-flex flex-wrap justify-content-center mt-3">
                <button
                    *ngIf="expense?.status?.id !== 61"
                    type="button" (click)="editExpense()" [disabled]="submitting"
                    class="btn btn-primary m-2">
                    <div class="d-flex flex-row p-1">
                        <i class="material-icons icon">edit</i>
                        <span class="px-1">EDITAR</span>
                    </div>
                </button>
                <button
                    *ngIf="expense?.status?.id !== 61"
                    type="button" (click)="deleteExpense()" [disabled]="submitting"
                    class="btn btn-danger m-2">
                    <div class="d-flex flex-row p-1">
                        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                        <i class="material-icons icon">delete</i>
                        <span class="px-1">ELIMINAR</span>
                    </div>
                </button>
            </div>
        </mat-card-content>
    </mat-card>
</div>
