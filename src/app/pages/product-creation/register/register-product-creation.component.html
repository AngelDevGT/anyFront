<div class="genericCard pt-3">
    <mat-card class="mat-elevation-z8">
        <mat-card-header style="justify-content: center;">
            <mat-card-title>{{title}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <br>
            <div *ngIf="loading" class="text-center m-5">
                <span class="spinner-border spinner-border-lg align-center"></span>
            </div>

            <div *ngIf="!loading" class="container">
                <div class="row justify-content-center">

                    <!-- El picker queda fuera del <form>: usa ngModel internamente y no
                         tiene por qué mezclarse con el formGroup del comentario. -->
                    <app-element-quantity-picker #picker [items]="pickerItems" [availableTitle]="availableLabel"
                        [selectedTitle]="selectedLabel" [searchPlaceholder]="'Buscar por nombre'"
                        [emptyAvailableText]="'No hay productos activos para registrar.'"
                        [emptySelectedText]="'Escribe una cantidad para agregar productos.'" [disabled]="submitting"
                        (selectionChange)="onSelectionChange($event)">
                    </app-element-quantity-picker>

                    <form [formGroup]="orderForm" class="col-12">
                        <div class="d-flex flex-wrap justify-content-center col-12 px-3 pb-2">
                            <mat-form-field class="col-sm-12 col-md-12 custom-input" appearance="outline">
                                <mat-label>Comentario</mat-label>
                                <textarea formControlName="comment" matInput maxlength="254"
                                    [ngClass]="{ 'is-invalid': f['comment'].errors && f['comment'].touched }"></textarea>
                                <mat-hint align="end">{{orderForm.get('comment')?.value?.length || 0}} / 254</mat-hint>
                                <div class="invalid-feedback" *ngIf="f['comment'].errors && f['comment'].touched">
                                    <div *ngIf="f['comment'].hasError('required')">Comentario requerido</div>
                                    <div *ngIf="f['comment'].hasError('maxlength')">Máximo 254 caracteres</div>
                                </div>
                            </mat-form-field>
                        </div>
                    </form>

                    <div class="col-sm-12 text-center p-2">
                        <button type="button" (click)="onSaveForm()"
                            [disabled]="submitting || !selection.length || picker.hasInvalid || f['comment'].invalid"
                            class="btn btn-outline-success btn-lg">
                            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                            {{registerLabel}}
                        </button>
                    </div>

                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
