<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">{{pageTitle}}</h4>
      <p class="page-subtitle">Consulta y gestiona los pedidos de productos para venta</p>
    </div>
    <button *ngIf="productForSaleOrdes && viewOption != 'factory'" type="button" (click)="navigateWithParams()" class="btn-add">
      <i class="material-icons">add</i>
      Crear Pedido
    </button>
  </div>

  <div class="content-card">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search($event)" />
      </div>
      <div class="toolbar-right">
        <div class="date-wrapper" (click)="$event.stopPropagation()">
          <button class="filter-main-btn" [class.open]="datePanelOpen" type="button" (click)="toggleDatePanel($event)">
            <i class="material-icons" style="font-size:17px">event</i>
            Fecha
            <span *ngIf="dateRangeLabel" class="date-range-label">{{ dateRangeLabel }}</span>
            <i class="material-icons chevron-icon">keyboard_arrow_down</i>
          </button>

          <div class="date-panel" *ngIf="datePanelOpen">
            <div class="date-panel-header">
              <span class="date-panel-title">
                <i class="material-icons" style="font-size:16px">event</i>
                Rango de fechas
              </span>
              <button class="date-close-btn" type="button" (click)="closeDatePanel()">
                <i class="material-icons" style="font-size:18px">close</i>
              </button>
            </div>

            <div class="date-panel-body">
              <mat-calendar
                [selected]="selectedDateRange"
                [maxDate]="maxDate"
                (selectedChange)="onDateRangeChange($event)">
              </mat-calendar>
            </div>

            <div class="date-panel-footer">
              <button class="btn-reset" type="button" (click)="resetDateRange()">Últimos 15 días</button>
              <button class="btn-date-apply" type="button" (click)="applyDateRange()">Buscar</button>
            </div>
          </div>
        </div>

        <div class="dropdown">
          <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            {{ selectedSortOpt }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li *ngFor="let opt of sortOpts">
              <a class="dropdown-item" (click)="sortDataByDate(opt)">{{ opt }}</a>
            </li>
          </ul>
        </div>
        <div class="dropdown" *ngIf="availableStatuses.length">
          <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
            {{ statusFilter || 'Estado' }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="filterByStatus(null)">Todos</a></li>
            <li *ngFor="let s of availableStatuses">
              <a class="dropdown-item" (click)="filterByStatus(s)">{{ s }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <data-table *ngIf="productForSaleOrdes" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="loadingOrders || loadingEstablishments" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
