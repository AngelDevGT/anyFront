<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h4 class="page-title">Registro de proveedores</h4>
      <p class="page-subtitle">Administra los proveedores registrados</p>
    </div>
    <button *ngIf="providers" type="button" routerLink="create" class="btn-add">
      <i class="material-icons">add</i>
      Registrar proveedor
    </button>
  </div>

  <div class="content-card">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input type="text" class="search-input" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="search($event)" />
      </div>
    </div>

    <data-table *ngIf="providers" [tableElements]="tableElementsValues" [initialPageSize]="pageSize"></data-table>
    <div *ngIf="!providers" class="loading-wrap">
      <span class="spinner-border spinner-border-lg"></span>
    </div>
  </div>

</div>
