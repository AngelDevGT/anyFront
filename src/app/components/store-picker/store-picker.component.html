<div class="store-picker">
  <label class="store-picker-label" for="store-picker-select">
    <i class="material-icons">storefront</i>
    {{ label }}
  </label>

  <div class="store-picker-control">
    <select id="store-picker-select"
            class="store-picker-select"
            [disabled]="loading || !stores?.length"
            [ngModel]="selectedId"
            (ngModelChange)="onSelectionChange($event)">
      <option value="">Selecciona una tienda</option>
      <option *ngFor="let store of stores" [value]="store.id">{{ store.name }}</option>
    </select>
    <span *ngIf="loading" class="spinner-border spinner-border-sm store-picker-spinner"></span>
  </div>

  <span *ngIf="!loading && !stores?.length" class="store-picker-empty">
    No tienes tiendas asignadas
  </span>
</div>
